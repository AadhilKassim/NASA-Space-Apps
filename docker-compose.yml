services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
